transaction_analytics:
  target: dev
  outputs:
    dev:
      type: clickhouse
      host: "{{ env_var('CLICKHOUSE_HOST', '127.0.0.1') }}"
      port: "{{ env_var('CLICKHOUSE_HTTP_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'homework') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'homework') }}"
      schema: "{{ env_var('CLICKHOUSE_DATABASE', 'analytics') }}"
      secure: "{{ env_var('CLICKHOUSE_SECURE', 'False') | as_bool }}"
      threads: 4
      connect_timeout: 10
      send_receive_timeout: 300
