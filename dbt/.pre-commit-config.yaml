repos:
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.4.0
    hooks:
      - id: sqlfluff-lint
        entry: bash -c 'cd dbt && sqlfluff lint models tests'
        pass_filenames: false
        files: ^dbt/(models|tests)/.*\.sql$
        additional_dependencies:
          - dbt-core==1.10.15
          - dbt-clickhouse==1.9.7
          - sqlfluff-templater-dbt==4.4.0
