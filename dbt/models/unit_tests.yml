- name: category_fraud_denominator_and_sums
  description: category fraud denominator and sums
  model: mart_fraud_by_category
  given:
  - input: ref('stg_transactions')
    rows:
    - transaction_time: '2020-01-05 23:45:00'
      transaction_date: '2020-01-05'
      transaction_hour: 23
      day_of_week: 7
      customer_id: c1
      merchant_id: m1
      merchant_name: Shop
      category: shopping_net
      us_state: TX
      amount: 10
      is_fraud: 0
      amount_bucket: SMALL
    - transaction_time: '2020-01-05 23:45:00'
      transaction_date: '2020-01-05'
      transaction_hour: 23
      day_of_week: 7
      customer_id: c1
      merchant_id: m1
      merchant_name: Shop
      category: shopping_net
      us_state: TX
      amount: 20
      is_fraud: 1
      amount_bucket: SMALL
    - transaction_time: '2020-01-05 23:45:00'
      transaction_date: '2020-01-05'
      transaction_hour: 23
      day_of_week: 7
      customer_id: c1
      merchant_id: m1
      merchant_name: Shop
      category: travel
      us_state: TX
      amount: 5
      is_fraud: 0
      amount_bucket: SMALL
  expect:
    rows:
    - category: shopping_net
      transaction_count: 2
      fraud_count: 1
      fraud_rate: 50
      total_amount: 30
      fraud_amount: 20
      avg_amount: 15
    - category: travel
      transaction_count: 1
      fraud_count: 0
      fraud_rate: 0
      total_amount: 5
      fraud_amount: 0
      avg_amount: 5
